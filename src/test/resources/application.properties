spring.application.name=event-platform

# Configure H2 in-memory database for tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
spring.datasource.username=sa
spring.datasource.password=

# Kafka disabled for tests (not needed - mocked instead)
kafka.enabled=false

# H2 Console disabled in tests
spring.h2.console.enabled=false

# Show SQL queries for debugging
spring.jpa.show-sql=true

# Import main application properties but override test-specific settings
spring.profiles.active=test

# Cache configuration for tests
spring.cache.type=generic
spring.cache.userCache.time-to-live=600000
spring.cache.eventCache.time-to-live=300000

# Disable hibernate ddl-auto in tests (we want to auto-initialize)
spring.jpa.hibernate.ddl-auto=create-drop

# H2-specific settings for tests
spring.h2.console.enabled=false