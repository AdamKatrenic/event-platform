spring.application.name=event-platform

# Configure H2 in-memory database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Optional: Show SQL queries executed by Hibernate/JPA (useful for debugging)
spring.jpa.show-sql=true

# ========================================
# KAFKA CONFIGURATION (Spring Boot Auto-config)
# ========================================
# Kafka is disabled by default. Enable with kafka.enabled=true property
kafka.enabled=false

# Kafka Bootstrap Servers (only used when kafka.enabled=true)
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer Configuration (only used when kafka.enabled=true)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=event-platform-consumer-group

# Kafka Producer Configuration (only used when kafka.enabled=true)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Idempotence - prevents duplicate message processing during retries (only used when kafka.enabled=true)
kafka.enable-idempotence=true

# ========================================
# CACHE CONFIGURATION
# ========================================
# Enable caching
spring.cache.type=generic

# Event cache configuration (5 minutes TTL)
spring.cache.eventCache.time-to-live=300000

# User cache configuration (10 minutes TTL)
spring.cache.userCache.time-to-live=600000

# ========================================
# ACTUATOR & MONITORING
# ========================================
# Enable Spring Boot Actuator for health checks and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Database connection pool configuration (H2 specific)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# DATABASE OPTIMIZATIONS
# ========================================
# Enable SQL logging for query performance analysis
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Recommended indexes (documented for future implementation)
# - events(title, startTime, createdAt) - For title search and date-based queries
# - bookings(eventId, userId, status) - For booking-related queries
# - users(email, username) - For authentication and registration lookups
# These should be added using Hibernate @Index annotations or DDL scripts